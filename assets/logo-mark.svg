<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 12 62 40" width="62" height="40" role="img" aria-label="VA monogram">
  <!-- V: flat top, flat base; its right arm is also the A's left leg -->
  <polygon fill="currentColor" points="8,14 18,14 29,38.75 40,14 50,14 34,50 24,50"/>
  <!-- A: right leg (the apex is the shared flat top) -->
  <polygon fill="currentColor" points="40,14 50,14 66,50 56,50"/>
  <!-- A: crossbar, in the signal colour -->
  <polygon class="signal" fill="var(--signal, #0a66c2)" points="39.3,38 50.7,38 53.8,45 36.2,45"/>
</svg>
